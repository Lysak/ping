[versions]
agp = "9.3.1"
kotlin = "2.4.10"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
# material3 pinned ahead of the BOM: MaterialExpressiveTheme / MotionScheme are
# internal in 1.4.0 stable, public only from 1.5.0-alpha (which needs minSdk 24).
# AGENTS.md requires Expressive. Revisit when a 1.5.0 beta/stable lands in the BOM.
material3 = "1.5.0-alpha27"
datastore = "1.2.1"
coreSplashscreen = "1.0.1"
spotless = "7.0.2"
# detekt 2.0 alpha is required: 1.23.x bundles an old Kotlin analyzer that
# cannot parse Kotlin 2.4 sources or run on JDK 25. 2.0-alpha is built against
# Kotlin 2.4 / AGP 9.3 / JDK 25 — i.e. this project's exact toolchain.
detekt = "2.0.0-alpha.6"
konsist = "0.17.3"
composeRules = "0.6.6"
# Must match kotlinx-coroutines-core in the app (1.9.0, pinned by the Compose BOM
# via AGP consistent resolution). A newer coroutines-test calls core APIs that
# 1.9.0 lacks -> NoSuchMethodError at runtime in instrumented tests.
coroutinesTest = "1.9.0"
junit = "4.13.2"
junitJupiter = "5.13.2"
androidJunit5 = "2.0.1"
truth = "1.4.4"
mockk = "1.14.11"
turbine = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
detekt-compose = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "composeRules" }
# androidx.test kept current so Compose UI test (compose 1.12) can launch its
# ActivityScenario — older core/runner/espresso silently fail to attach the
# composition ("No compose hierarchies found").
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.7.0" }
androidx-test-core = { group = "androidx.test", name = "core", version = "1.7.0" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
android-junit5 = { id = "de.mannodermaus.android-junit5", version.ref = "androidJunit5" }
